[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lessonplan"
version = "0.1.0"
description = "教案模板：分节文本一键生成 A4 可打印教案"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["lesson-plan", "teacher", "education", "print", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
lessonplan = "lessonplan.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/lessonplan"
Source = "https://github.com/eastyou/lessonplan"

[tool.setuptools]
packages = ["lessonplan"]
